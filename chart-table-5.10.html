<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Citation score</title>
<style>
body{font-family:system-ui,sans-serif;background:#fff;color:#222;max-width:900px;margin:30px auto;padding:0 16px}
h2{margin-bottom:4px}.sub{color:#666;margin-bottom:16px}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:13px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.l-full::before{background:#1b5e20}.l-part::before{background:#a5d6a7}.l-none::before{background:#e0e0e0}
.group{margin:22px 0 6px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#555;border-bottom:1px solid #ddd;padding-bottom:3px}
.row{display:grid;grid-template-columns:90px 1fr 60px;align-items:center;gap:10px;margin:6px 0}
.name{font-size:14px;text-align:right}
.bar{display:flex;height:28px;border-radius:3px;overflow:hidden}
.bar div{display:flex;align-items:center;justify-content:center;font-size:12px;white-space:nowrap}
.f{background:#1b5e20;color:#fff}.p{background:#a5d6a7;color:#12331a}.n{background:#e0e0e0;color:#444}
.score{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.head{font-size:12px;color:#777}
.note{font-size:12px;color:#777;margin-top:20px}
</style></head><body>
<h2>Exact article and clause citation score</h2>
<div class="sub">Share of queries by citation outcome (420 scored queries per system)</div>
<div class="legend"><span class="l-full">Full</span><span class="l-part">Partial</span><span class="l-none">None</span></div>
<div id="chart"></div>
<div class="note">Sorted by score within each family. Segments under 5% show no label.</div>
<script>
const data={
"Naive":[["B-N naive",.304,6.9,39.5,53.6],["A-N naive",.267,6.0,28.6,65.5],["C-N naive",.224,6.0,32.9,61.2]],
"Agentic":[["B agentic",.260,7.4,37.1,55.5],["A agentic",.238,6.2,35.2,58.6],["C agentic",.210,3.3,35.2,61.4]],
"Cloud":[["E cloud",.260,1.7,22.4,76.0],["F cloud",.202,8.6,34.8,56.7],["D cloud",.129,3.3,35.2,61.4]]
};
data.Cloud[2]=["D cloud",.129,1.7,22.4,76.0];
data.Cloud[0]=["E cloud",.260,8.6,34.8,56.7];
data.Cloud[1]=["F cloud",.202,3.3,35.2,61.4];
const seg=(c,v)=>`<div class="${c}" style="width:${v}%">${v>=5?v.toFixed(1)+'%':''}</div>`;
let h='';
for(const [g,rows] of Object.entries(data)){
 h+=`<div class="group">${g}</div><div class="row head"><div></div><div></div><div class="score">Score</div></div>`;
 for(const [n,s,f,p,x] of rows)
  h+=`<div class="row"><div class="name">${n}</div><div class="bar">${seg('f',f)}${seg('p',p)}${seg('n',x)}</div><div class="score">${s.toFixed(3)}</div></div>`;
}
document.getElementById('chart').innerHTML=h;
</script></body></html>
