# Bilingual RAG Configuration
# Configuration settings for the Laurentian University Faculty Association
# collective agreement RAG system

# Language Settings
languages:
  supported:
    - en
    - fr
  default: en

# Model Configuration
models:
  llm:
    name: "llama3.1:8b-gpu"
    base_url: "http://localhost:11434"
    request_timeout: 240.0
    # Base context window. Left unset, LlamaIndex requests the model's FULL trained
    # context (131072), which inflates the KV cache to ~18 GB and forces Ollama to run
    # most layers on the CPU on a 6 GB GPU (measured: 77%/23% CPU/GPU). This is the
    # floor; src/llm_utils.py widens it per request when a prompt needs more.
    context_window: 12288
    # Ceiling for the automatic widening. Going past the 6 GB card is permitted —
    # Windows spills into the 24 GB shared pool — and the spill is recorded in
    # gpu_vram_shared_mb so its cost stays visible rather than hidden.
    max_context_window: 24576
    # Predicted generation ("thinking") tokens, as a fraction of the prompt. Typical
    # for non-reasoning instruct models on extractive RAG QA is ~0.15-0.35; 0.35 is the
    # conservative end. Clamped by the min/max below.
    output_reserve_ratio: 0.35
    output_reserve_min: 768
    output_reserve_max: 4096

  embedding:
    name: "nomic-embed-text-v2-moe"
    base_url: "http://localhost:11434"

  # LLM-as-judge model (RAGAS metrics + citation-accuracy judge). Used when
  # --judge_llm is NOT passed to evaluate.py / metrics.py. Routing (Ollama vs
  # OpenAI-compatible) is auto-selected from this model's model_api_auth entry.
  judge_llm:
    name: "tensortemplar/prometheus2:8x7b-Q4_K_S"

# Database Configuration
database:
  path: "db/chroma_db"
  collection_name: "multilingual_docs"

# Document Processing
ingestion:
  chunk_size: 512
  chunk_overlap: 50

# Retrieval Settings
retrieval:
  top_k: 5
  similarity_threshold: 0.7
  response_mode: "compact"  # Options: compact, refine, tree_summarize

# Data Directories
data:
  english_dir: "data/english"
  french_dir: "data/french"
  metadata_file: "data/metadata.json"

# Agreement Configuration
agreement:
  default_year_range: "2020 - 2025"

# Evaluation / instrumentation (Ch4 §4.6.4)
evaluation:
  # Warm-up protocol: run the first question's retrieval twice, record only the
  # second pass (discard cold-start); every other question is timed on its first run.
  warmup_first_query: true

# System Prompts
prompts:
  en: "You are a helpful assistant answering questions about the Laurentian University Faculty Association collective agreement. Respond in English."
  fr: "Tu es un assistant utile qui répond aux questions sur la convention collective de l'Association des professeur(e)s de l'Université Laurentienne. Réponds en français."

# UI Configuration
ui:
  page_title: "LUFA Collective Agreement - Bilingual RAG"
  page_icon: "🌍"
  layout: "wide"
  languages:
    en: "English"
    fr: "Français"

# Feature Flags
features:
  source_display: true
  language_stats: true
  chat_history: true

# Copilot / Frontier Model Configuration
copilot:
  github_token: ""
  github_models_endpoint: "https://models.inference.ai.azure.com"

# Model API Authentication
# Per-model (api_key, api_base) entries.  Unknown models fall back to "default".
# Use env vars MODEL_API_KEY_<NAME> / MODEL_API_BASE_<NAME> to override at runtime.
# Gemini / Claude entries point to the local model proxy (src/model_proxy.py — uses CLI, no API keys needed).
# Gemini requests are routed through antigravity (Google Antigravity IDE with built-in Gemini).
# Set GEMINI_FALLBACK_CLI=1 env var to use headless gemini CLI instead.
model_api_auth:
  default:
    api_key: ""
    api_base: "http://localhost:11434/api" #run via ollama server
  gpt-5.4-mini:
    api_key: "dummy"
    api_base: "http://127.0.0.1:8317/v1" #run via https://github.com/AmazingAng/auth2api
  tencent/hy3:free:
    api_key: "dummy"
    api_base: "https://openrouter.ai/api/v1"
  gemini-3.1-flash-lite:
    api_key: "dummy"
    api_base: "http://127.0.0.1:4000" #run via https://github.com/badrisnarayanan/antigravity-claude-proxy
  claude-haiku-4-5:
    api_key: ""
    api_base: "http://127.0.0.1:3456/v1" #run via https://github.com/wende/claude-max-api-proxy
